services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simang_app_dev
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - simang_vendor:/var/www/vendor
      - ./storage:/var/www/storage
    environment:
      APP_NAME: SIMANG
      APP_ENV: production
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "false"
      APP_URL: "${APP_URL}"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: simang
      DB_USERNAME: simang_user
      DB_PASSWORD: "${DB_PASSWORD}"
      # SESSION_DRIVER: database
      SESSION_DRIVER: file
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    depends_on:
      db:
        condition: service_healthy
    networks:
      - simang_network

  webserver:
    image: nginx:alpine
    container_name: simang_nginx_dev
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - simang_network

  db:
    image: postgres:16-alpine
    container_name: simang_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: simang
      POSTGRES_USER: simang_user
      POSTGRES_PASSWORD: "${DB_PASSWORD:-simang_secret}"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U simang_user -d simang" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simang_network

volumes:
  postgres_data_dev:
    driver: local

  simang_vendor:
    driver: local

networks:
  simang_network:
    driver: bridge
